name: Build NoviumOS

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential gcc-multilib qemu-system-x86 \
            grub-common grub-pc-bin xorriso mtools

      - name: Build
        run: |
          make clean
          make

      - name: Locate NoviumOS ISO
        run: |
          ISO_IMAGE="$(find build/iso -maxdepth 1 -type f -name '*.iso' -print -quit)"
          test -n "$ISO_IMAGE"
          echo "ISO_IMAGE=$ISO_IMAGE" >> "$GITHUB_ENV"

      - name: Upload NoviumOS ISO
        uses: actions/upload-artifact@v4
        with:
          name: novium-iso
          path: build/iso/*.iso

      - name: Run in QEMU
        run: |
          set +e
          timeout 10s qemu-system-i386 \
            -cdrom "$ISO_IMAGE" \
            -boot d \
            -display none
          status=$?
          if [ "$status" -ne 124 ]; then
            exit "$status"
          fi

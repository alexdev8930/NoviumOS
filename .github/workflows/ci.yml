name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_32-gcc
            cc: gcc
          - target: x86_32-clang
            cc: clang

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib clang \
            qemu-system-x86 grub-common grub-pc-bin xorriso mtools

      - name: Build
        run: |
          make clean
          make CC=${{ matrix.cc }}

      - name: Locate NoviumOS ISO
        run: |
          ISO_IMAGE="$(find build/iso -maxdepth 1 -type f -name '*.iso' -print -quit)"
          test -n "$ISO_IMAGE"
          echo "ISO_IMAGE=$ISO_IMAGE" >> "$GITHUB_ENV"

      - name: Upload NoviumOS ISO
        uses: actions/upload-artifact@v4
        with:
          name: novium-iso-${{ matrix.target }}
          path: build/iso/*.iso

      - name: Run in QEMU
        run: |
          set +e
          timeout 10s qemu-system-i386 \
            -m 64M \
            -drive format=raw,file="$ISO_IMAGE" \
            -display none \
            -no-reboot
          status=$?
          if [ "$status" -ne 124 ]; then
            exit "$status"
          fi